name: CalendarApp
options:
  bundleIdPrefix: dev.libirabu
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"

# The app depends on the local CalendarKit Swift package (the calendar itself lives
# there); this target is just the shell that hosts CalendarView in a real .app
# bundle, so Xcode's debugger + View Debugger work fully.
packages:
  CalendarKit:
    path: ../CalendarKit

targets:
  CalendarApp:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: CalendarKit
        product: CalendarUI
    settings:
      base:
        PRODUCT_NAME: Calendar
        PRODUCT_BUNDLE_IDENTIFIER: dev.libirabu.calendar
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Calendar
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: X84ZG75WAM
        CODE_SIGN_ENTITLEMENTS: CalendarApp.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  # iPhone app. Shares the CalendarKit package + the CloudKit container with the macOS
  # shell above. It depends on CalendarEngine ONLY (which carries the CloudKit sync layer);
  # the AppKit-bound CalendarUI is not linked here, so nothing AppKit compiles for iOS.
  # UI is a sync harness (iOS/SyncHarnessView) until the UIKit renderer is ported.
  CalendarPhone:
    type: application
    platform: iOS
    sources:
      - path: iOS
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Calendar
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]   # CKSyncEngine push delivery
    dependencies:
      - package: CalendarKit
        product: CalendarEngine
    settings:
      base:
        PRODUCT_NAME: Calendar
        PRODUCT_BUNDLE_IDENTIFIER: dev.libirabu.calendar
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: X84ZG75WAM
        CODE_SIGN_ENTITLEMENTS: CalendarApp-iOS.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
